name: Build N3X Pets Emotes 1.21.10

on:
  push:
    branches:
      - n3x-build-pets-emotes-1.21.10
    paths:
      - 'ci/n3x-pets-emotes-1.21.10/**'
      - '.github/workflows/build-n3x-pets-emotes-1-21-10.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Decode project
        run: |
          base64 -d ci/n3x-pets-emotes-1.21.10/project.zip.b64 > project.zip
          unzip -q project.zip
      - name: Build
        run: gradle -p ui-1.21.10 clean remapJar --no-daemon --stacktrace
      - name: Show jars
        run: ls -lah ui-1.21.10/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: n3x-pets-emotes-1.21.10
          path: ui-1.21.10/build/libs/n3x-ui-fabric-1.21.10-0.5.0.jar
          if-no-files-found: error
