name: Build N3X Forge Cape Menu

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/forge-cape-menu/**'
      - '.github/workflows/build-n3x-forge-cape-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/forge-cape-menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.20.1 addon
        run: gradle build --no-daemon --stacktrace
      - name: Show output
        run: ls -lah build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: n3x-cape-menu-forge-1.20.1
          path: tools/forge-cape-menu/build/libs/n3x-cape-menu-forge-1.20.1-0.1.0.jar
          if-no-files-found: error
